<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>厄运退散</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#30344a;background:linear-gradient(145deg,#fff4dc,#dff5ff);overflow:hidden}body{display:flex;align-items:center;justify-content:center}.app{width:min(980px,100vw);height:min(760px,100vh);padding:12px;display:flex;flex-direction:column;gap:10px}.head{display:flex;justify-content:space-between;align-items:center;padding:0 3px}.ttl{font-size:24px;font-weight:900}.sub{font-size:12px;opacity:.62;margin-top:2px}.hint{font-size:12px;background:#ffffffc9;border-radius:999px;padding:8px 12px;box-shadow:0 7px 20px #40516c18}.stage{position:relative;flex:1;min-height:0;border-radius:24px;overflow:hidden;background:linear-gradient(#dff6ff 0 78%,#bde8b3 78%);box-shadow:0 18px 50px #40516c22}.cloud{position:absolute;width:92px;height:30px;border-radius:40px;background:#ffffff99}.c1{top:14%;left:7%;animation:float 12s ease-in-out infinite}.c2{top:28%;left:58%;animation:float 15s ease-in-out infinite reverse}.c3{top:10%;left:82%;animation:float 11s ease-in-out infinite}@keyframes float{50%{transform:translateX(38px)}}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}.hud{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;pointer-events:none}.hud>div{background:#ffffffdb;padding:8px 11px;border-radius:13px;font-size:12px;box-shadow:0 6px 18px #40516c16}.bossbar{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(480px,60%);text-align:center;font-size:12px;font-weight:900;pointer-events:none}.bar{height:12px;background:#fff;border-radius:999px;overflow:hidden;margin-top:5px;box-shadow:0 4px 14px #40516c19}.fill{height:100%;width:100%;background:linear-gradient(90deg,#ff9d74,#ff688c);transition:width .12s}.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#30344ae9;color:#fff;padding:8px 13px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;white-space:nowrap;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,5px)}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#ffffff45;backdrop-filter:blur(5px)}.card{width:min(560px,94%);padding:28px 24px;border-radius:24px;background:#fffffff1;text-align:center;box-shadow:0 18px 55px #35455e2b}.card h1,.card h2{margin:0}.card h1{font-size:clamp(38px,8vw,58px)}.card h2{font-size:clamp(30px,7vw,46px)}.card p{margin:14px 0 0;line-height:1.8;font-size:15px}.small{font-size:12px!important;opacity:.62}.btn{border:0;border-radius:16px;background:#30344a;color:#fff;padding:13px 26px;font-size:16px;font-weight:900;margin-top:18px;box-shadow:0 8px 20px #30344a28}.attack-wrap{display:flex;gap:10px}.attack{width:100%;height:56px;border:0;border-radius:17px;background:#ff8fa5;color:#fff;font-size:18px;font-weight:900;box-shadow:0 9px 22px #40516c1c;touch-action:none}.attack:active{transform:translateY(1px)}.hidden{display:none!important}@media(max-width:799px){.hint{display:none}.ttl{font-size:21px}.app{padding:9px}.card{padding:24px 18px}}
</style>
</head>
<body>
<div class="app">
  <div class="head"><div><div class="ttl">厄运退散</div><div class="sub">拖着自己走，别让坏运气碰到你。</div></div><div class="hint">拖动角色躲避｜按住攻击连发</div></div>
  <div class="stage" id="stage">
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
    <canvas id="cv"></canvas>
    <div class="hud hidden" id="hud"><div>❤️ <span id="hp">5</span>　✨ <span id="buff">冷静 0</span></div><div id="wave">第 1 波</div></div>
    <div class="bossbar hidden" id="bossbar"><div id="bossname">法考</div><div class="bar"><div class="fill" id="bossfill"></div></div></div>
    <div class="toast" id="toast"></div>
    <div class="overlay" id="start"><div class="card"><h1>厄运退散</h1><p>这次不站着挨打了。<br><b>按住蓝色小人直接拖动</b>，躲开小怪和攻击；<br>顺手捡掉落，再把它们打回去。<br><br>最后那只大的——叫 <b>法考</b>。</p><button class="btn" onclick="startGame()">开打</button><p class="small">手机：拖动角色 + 按住下方攻击｜电脑：鼠标拖动 + 空格</p></div></div>
    <div class="overlay hidden" id="win"><div class="card"><h2>法考，击败。</h2><p>坏运气清得差不多了。<br><b>剩下那点紧张，带着也能上场。</b></p><p>现实里的那只，也去打吧。🌟</p><button class="btn" onclick="startGame()">再揍一次</button></div></div>
    <div class="overlay hidden" id="lose"><div class="card"><h2>被撞了一下。</h2><p>没事，这里无限续命。<br>再拖灵活点，把它们全躲过去。</p><button class="btn" onclick="startGame()">继续揍</button></div></div>
  </div>
  <div class="attack-wrap"><button class="attack" id="attack">按住攻击 ✦</button></div>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage');
let W=800,H=520,dpr=1,running=false,last=0,t=0,dragging=false,bullets=[],enemies=[],drops=[],parts=[],boss=null,wave=1,spawned=0,killed=0,spawnT=0,atkCd=0,inv=0,buff=0,warning=null;
const P={x:95,y:260,w:44,h:52,hp:5};
const names=['我是不是记不住了','别人都复习得更好','这一题怎么又错','完了来不及了'];
const armor=['不过怎么办','别人怎么看我','是不是证明我不行'];
function resize(){const r=stage.getBoundingClientRect();dpr=devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);W=r.width;H=r.height;P.x=Math.min(P.x,W*.55);P.y=Math.min(Math.max(60,P.y),H-75)}addEventListener('resize',resize);resize();
function show(id,v=true){$(id).classList.toggle('hidden',!v)}
function say(s){$('toast').textContent=s;$('toast').classList.add('on');clearTimeout(say._t);say._t=setTimeout(()=>$('toast').classList.remove('on'),850)}
function updateHud(){$('hp').textContent=P.hp;$('wave').textContent=boss?'BOSS':'第 '+wave+' 波';const b=['冷静','手感','记忆力','管他呢'];$('buff').textContent=b[Math.min(3,Math.floor(buff/30))]+' '+buff}
function rr(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fill()}
function burst(x,y,n,c){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*250,vy:(Math.random()-.6)*230,l:.35+Math.random()*.5,c,r:2+Math.random()*4})}
function reset(){bullets=[];enemies=[];drops=[];parts=[];boss=null;warning=null;wave=1;spawned=0;killed=0;spawnT=.5;atkCd=0;inv=0;buff=0;P.x=90;P.y=H/2;P.hp=5;updateHud();show('bossbar',false)}
function startGame(){reset();show('start',false);show('win',false);show('lose',false);show('hud',true);running=true;last=performance.now();requestAnimationFrame(loop)}
function shoot(){if(!running||atkCd>0)return;atkCd=.15;bullets.push({x:P.x+40,y:P.y+25,v:690,r:6});burst(P.x+42,P.y+25,3,'#ffe27a')}
function spawnMob(){let i=spawned%names.length;enemies.push({x:W+35,y:70+Math.random()*Math.max(60,H-170),w:48,h:48,v:105+wave*18+Math.random()*40,hp:1+wave,max:1+wave,n:names[i],hue:20+i*70,proj:false});spawned++}
function drop(x,y){const ds=[['冷静 +10',10],['手感 +20',20],['记忆力 +30',30],['管他呢 +100',100]],d=ds[Math.random()<.08?3:Math.floor(Math.random()*3)];drops.push({x,y,vy:-80,l:5,n:d[0],v:d[1]})}
function bossIn(){boss={x:W-175,y:H/2-65,w:130,h:130,hp:18,max:18,p:0,shot:1};show('bossbar',true);$('bossname').textContent='法考 · 护甲「'+armor[0]+'」';$('bossfill').style.width='100%';updateHud();say('最终 BOSS：法考')}
function nextBoss(){boss.p++;warning=null;if(boss.p<3){boss.hp=boss.max=18;$('bossname').textContent='法考 · 护甲「'+armor[boss.p]+'」';say('护甲碎了一层！')}else if(boss.p===3){boss.hp=boss.max=28;$('bossname').textContent='法考 · 真身';say('原来真身也就这样。')}else{burst(boss.x+65,boss.y+65,90,'#ffd166');running=false;show('hud',false);show('bossbar',false);setTimeout(()=>show('win',true),320);boss=null;return}$('bossfill').style.width='100%'}
function hurt(){if(inv>0||!running)return;P.hp--;inv=.8;burst(P.x+22,P.y+25,20,'#ff8ca2');updateHud();if(P.hp<=0){running=false;show('hud',false);show('bossbar',false);setTimeout(()=>show('lose',true),260)}}
function hit(a,b){return a.x<b.x+b.w&&a.x+(a.w||1)>b.x&&a.y<b.y+b.h&&a.y+(a.h||1)>b.y}
function playerTo(clientX,clientY){const r=cv.getBoundingClientRect();let x=clientX-r.left-P.w/2,y=clientY-r.top-P.h/2;P.x=Math.max(14,Math.min(W*.58,x));P.y=Math.max(54,Math.min(H-72,y))}
cv.addEventListener('pointerdown',e=>{if(!running)return;dragging=true;cv.setPointerCapture?.(e.pointerId);playerTo(e.clientX,e.clientY);e.preventDefault()},{passive:false});
cv.addEventListener('pointermove',e=>{if(!running||!dragging)return;playerTo(e.clientX,e.clientY);e.preventDefault()},{passive:false});
cv.addEventListener('pointerup',e=>{dragging=false;e.preventDefault()},{passive:false});cv.addEventListener('pointercancel',()=>dragging=false);
function bossAttack(dt){if(!boss)return;boss.shot-=dt;if(warning){warning.t-=dt;if(warning.t<=0){enemies.push({x:boss.x-5,y:warning.y-18,w:42,h:36,v:330,hp:99,max:99,n:'焦虑波',hue:330,proj:true});warning=null;boss.shot=.75+Math.random()*.45}}else if(boss.shot<=0){warning={y:P.y+P.h/2,t:.62};say('躲开红线！')}}
function update(dt){t+=dt;atkCd=Math.max(0,atkCd-dt);inv=Math.max(0,inv-dt);spawnT-=dt;
 if(!boss&&wave<=3){const target=3+wave;if(spawned<target&&spawnT<=0){spawnMob();spawnT=.8+Math.random()*.45}if(killed>=target){wave++;spawned=0;killed=0;spawnT=.7;if(wave<=3){say('下一波！');updateHud()}else setTimeout(()=>running&&bossIn(),650)}}
 if(boss){boss.y=H/2-65+Math.sin(t*1.8)*Math.min(80,H*.16);bossAttack(dt)}
 bullets.forEach(b=>b.x+=b.v*dt);bullets=bullets.filter(b=>b.x<W+30&&!b.dead);
 enemies.forEach(e=>{e.x-=e.v*dt;if(hit(e,P)){e.dead=true;hurt()}if(!e.proj&&e.x<-60)e.dead=true;if(e.proj&&e.x<-80)e.dead=true});
 bullets.forEach(b=>{for(const e of enemies){if(e.dead||e.proj||b.dead)continue;if(b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){e.hp--;b.dead=true;burst(b.x,b.y,7,'#ffe27a');if(e.hp<=0){e.dead=true;killed++;drop(e.x+24,e.y+24);burst(e.x+24,e.y+24,17,'#ffd166')}break}}if(boss&&!b.dead&&b.x>boss.x&&b.x<boss.x+boss.w&&b.y>boss.y&&b.y<boss.y+boss.h){boss.hp--;b.dead=true;burst(b.x,b.y,6,'#fff1a8');$('bossfill').style.width=Math.max(0,boss.hp/boss.max*100)+'%';if(boss.hp<=0)nextBoss()}});
 bullets=bullets.filter(b=>!b.dead);enemies=enemies.filter(e=>!e.dead);
 drops.forEach(d=>{d.vy+=150*dt;d.y+=d.vy*dt;d.l-=dt;if(d.y>H-65){d.y=H-65;d.vy=0}if(Math.abs((P.x+22)-d.x)<42&&Math.abs((P.y+25)-d.y)<42){d.dead=true;buff+=d.v;say(d.n);updateHud();burst(d.x,d.y,13,'#8ee6c0')}});drops=drops.filter(d=>!d.dead&&d.l>0);
 parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=250*dt;p.l-=dt});parts=parts.filter(p=>p.l>0)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#91d38f';ctx.fillRect(0,H-58,W,58);for(let x=22;x<W;x+=55){ctx.fillStyle='#ffffffb0';ctx.beginPath();ctx.arc(x,H-29+(x%4),3,0,7);ctx.fill()}
 if(warning){ctx.fillStyle='rgba(255,80,105,.18)';ctx.fillRect(0,warning.y-25,W,50);ctx.strokeStyle='rgba(255,80,105,.72)';ctx.lineWidth=2;ctx.setLineDash([9,7]);ctx.beginPath();ctx.moveTo(0,warning.y);ctx.lineTo(W,warning.y);ctx.stroke();ctx.setLineDash([])}
 ctx.save();ctx.globalAlpha=(inv>0&&Math.floor(inv*14)%2===0)?.45:1;ctx.translate(P.x,P.y);rr(0,8,44,42,14,'#5d7df9');ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(15,23,4,0,7);ctx.arc(30,23,4,0,7);ctx.fill();ctx.fillStyle='#30344a';ctx.beginPath();ctx.arc(16,24,1.5,0,7);ctx.arc(31,24,1.5,0,7);ctx.fill();rr(8,0,28,13,4,'#ffd166');ctx.fillStyle='#30344a';ctx.font='700 9px sans-serif';ctx.fillText('法条',13,10);ctx.restore();
 bullets.forEach(b=>{ctx.fillStyle='#ffd54f';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.fillStyle='#fff1a855';ctx.beginPath();ctx.arc(b.x,b.y,13,0,7);ctx.fill()});
 enemies.forEach(e=>{if(e.proj){rr(e.x,e.y,e.w,e.h,14,'#c87bea');ctx.fillStyle='#fff';ctx.font='900 16px sans-serif';ctx.fillText('?!',e.x+12,e.y+24)}else{rr(e.x,e.y,e.w,e.h,15,'hsl('+e.hue+' 78% 72%)');ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x+15,e.y+19,4,0,7);ctx.arc(e.x+33,e.y+19,4,0,7);ctx.fill();ctx.font='700 11px sans-serif';let tw=ctx.measureText(e.n).width+14;rr(e.x+(48-tw)/2,e.y-23,tw,18,9,'#30344ad9');ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(e.n,e.x+24,e.y-10);ctx.textAlign='left'}});
 if(boss){rr(boss.x,boss.y,130,130,28,'#ff8fa3');ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(boss.x+40,boss.y+48,10,0,7);ctx.arc(boss.x+90,boss.y+48,10,0,7);ctx.fill();ctx.fillStyle='#30344a';ctx.beginPath();ctx.arc(boss.x+43,boss.y+51,4,0,7);ctx.arc(boss.x+93,boss.y+51,4,0,7);ctx.fill();rr(boss.x+25,boss.y-28,80,24,12,'#30344ae8');ctx.fillStyle='#fff';ctx.font='900 15px sans-serif';ctx.textAlign='center';ctx.fillText('法考',boss.x+65,boss.y-11);ctx.textAlign='left'}
 drops.forEach(d=>{ctx.fillStyle='#86dfbb';ctx.beginPath();ctx.arc(d.x,d.y,15,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 16px sans-serif';ctx.fillText('✦',d.x-7,d.y+6)});parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.l/.8);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.globalAlpha=1})}
function loop(now){if(!running)return;const dt=Math.min(.033,(now-last)/1000||.016);last=now;update(dt);draw();requestAnimationFrame(loop)}
let fireTimer=null;function fireStart(e){e&&e.preventDefault();shoot();clearInterval(fireTimer);fireTimer=setInterval(shoot,180)}function fireStop(e){e&&e.preventDefault();clearInterval(fireTimer);fireTimer=null}
['pointerdown','touchstart','mousedown'].forEach(ev=>$('attack').addEventListener(ev,fireStart,{passive:false}));['pointerup','pointercancel','pointerleave','touchend','touchcancel','mouseup'].forEach(ev=>$('attack').addEventListener(ev,fireStop,{passive:false}));
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();shoot()}});draw();
</script>
</body>
</html>
