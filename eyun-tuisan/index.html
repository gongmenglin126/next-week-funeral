<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>厄运退散</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#30344a;background:linear-gradient(145deg,#fff2d8,#ddf6ff)}button{font:inherit}.app{width:min(980px,100vw);height:100dvh;max-height:780px;margin:auto;padding:max(9px,env(safe-area-inset-top)) 9px max(9px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}.head{display:flex;align-items:center;justify-content:space-between;padding:0 3px}.ttl{font-size:22px;font-weight:1000}.combo{font-size:12px;font-weight:900;background:#ffffffc9;border-radius:999px;padding:8px 11px;box-shadow:0 7px 20px #40516c16}.arena{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:24px;background:linear-gradient(#def5ff 0 72%,#c9edb9 72%);box-shadow:0 18px 50px #40516c22;touch-action:none}.arena.shake1{animation:shake1 .12s linear}.arena.shake2{animation:shake2 .16s linear}.arena.shake3{animation:shake3 .23s linear}@keyframes shake1{25%{transform:translateX(-3px)}60%{transform:translateX(3px)}}@keyframes shake2{20%{transform:translate(-6px,2px)}55%{transform:translate(6px,-2px)}80%{transform:translate(-3px,1px)}}@keyframes shake3{15%{transform:translate(-10px,4px) rotate(-.5deg)}40%{transform:translate(9px,-4px) rotate(.4deg)}65%{transform:translate(-6px,2px)}85%{transform:translate(4px,-1px)}}.flash{position:absolute;inset:0;pointer-events:none;z-index:7;opacity:0}.flash.on{animation:flash .16s ease-out}@keyframes flash{0%{opacity:.55;background:#fff}100%{opacity:0;background:#fff}}.hud{position:absolute;z-index:4;top:13px;left:50%;transform:translateX(-50%);width:min(650px,89%)}.stage-name{text-align:center;font-size:13px;font-weight:1000;margin-bottom:5px}.bar{height:15px;border-radius:999px;overflow:hidden;background:#fff;box-shadow:0 5px 14px #40516c17}.hp{height:100%;width:100%;background:linear-gradient(90deg,#ffad72,#ff6689);transition:width .09s}.rage{height:7px;margin-top:7px;border-radius:999px;overflow:hidden;background:#ffffffb8}.ragefill{height:100%;width:0;background:linear-gradient(90deg,#7184ff,#ad5ef3);transition:width .08s}.rageText{font-size:10px;text-align:right;opacity:.6;margin-top:2px}.target-area{position:absolute;inset:58px 0 0;z-index:2;display:flex;align-items:center;justify-content:center;touch-action:none}.target{position:relative;width:min(340px,72vw);height:min(340px,49vh);display:flex;align-items:center;justify-content:center;touch-action:none;transform-origin:center}.target.hit1{animation:hit1 .1s linear}.target.hit2{animation:hit2 .16s ease-out}.target.hit3{animation:hit3 .22s ease-out}@keyframes hit1{35%{transform:translateX(-8px) rotate(-2deg)}70%{transform:translateX(7px) rotate(2deg)}}@keyframes hit2{25%{transform:scale(.92) rotate(-5deg)}60%{transform:scale(1.05) rotate(4deg)}}@keyframes hit3{20%{transform:scale(.82) rotate(-8deg)}50%{transform:scale(1.12) rotate(7deg)}78%{transform:scale(.97)}}.enemy{width:84%;height:84%;border-radius:31px;background:#ffffffba;border:3px solid #ffffffc9;box-shadow:0 18px 45px #43506b25;display:flex;flex-direction:column;align-items:center;justify-content:center}.enemyIcon{font-size:clamp(82px,19vw,138px);line-height:1}.enemyName{font-size:clamp(29px,7vw,44px);font-weight:1000;margin-top:3px}.enemySub{font-size:12px;opacity:.52;margin-top:4px}.damage{position:absolute;z-index:8;pointer-events:none;font-size:21px;font-weight:1000;text-shadow:0 2px 0 #fff;animation:dmg .65s ease-out forwards}.damage.crit{font-size:28px;color:#ef3f56}.damage.word{font-size:17px;color:#7257df}@keyframes dmg{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}18%{opacity:1;transform:translate(-50%,-62%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-125px) scale(.9)}}.particle{position:absolute;z-index:6;pointer-events:none;font-size:30px;animation:fly .58s ease-out forwards}@keyframes fly{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(.45)}}.toast{position:absolute;z-index:9;left:50%;top:71px;transform:translateX(-50%);background:#30344aeb;color:#fff;border-radius:999px;padding:8px 13px;font-size:13px;opacity:0;transition:.15s;white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,4px)}.weapons{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.weapon{min-height:62px;border:0;border-radius:16px;background:#ffffffdf;color:#30344a;box-shadow:0 8px 18px #40516c16;font-size:11px;font-weight:1000;padding:7px 3px;touch-action:none}.weapon .ico{display:block;font-size:25px;margin-bottom:3px}.weapon.active{background:#fff;outline:3px solid #ff8fa6;transform:translateY(-1px)}.ultimate{grid-column:1/-1;min-height:46px;border:0;border-radius:15px;background:linear-gradient(90deg,#6e7fff,#a95def);color:#fff;font-size:15px;font-weight:1000;opacity:.4;box-shadow:0 9px 20px #625be02e;touch-action:none}.ultimate.ready{opacity:1;animation:pulse .8s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.012);filter:brightness(1.08)}}.overlay{position:absolute;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;padding:18px;background:#ffffff58;backdrop-filter:blur(6px);touch-action:none}.card{width:min(540px,93%);border-radius:26px;background:#fffffff4;padding:30px 22px;text-align:center;box-shadow:0 20px 55px #35455e2d}.card h1,.card h2{margin:0}.card h1{font-size:clamp(43px,10vw,64px)}.card h2{font-size:clamp(30px,7vw,46px)}.tagline{font-size:clamp(22px,6vw,34px);font-weight:1000;margin-top:10px}.btn{margin-top:20px;border:0;border-radius:16px;padding:13px 30px;background:#30344a;color:white;font-size:16px;font-weight:1000;touch-action:none}.verdict{margin-top:16px;padding:15px;border:2px solid #dd4652;border-radius:16px;background:#fff9f8;color:#8d2730;font-weight:1000;line-height:1.9}.stamp{display:inline-block;margin-top:13px;border:4px solid #d83f4b;color:#d83f4b;border-radius:10px;padding:3px 10px;font-size:29px;font-weight:1000;transform:rotate(-8deg)}.hidden{display:none!important}@media(max-width:620px){.app{gap:6px}.ttl{font-size:20px}.combo{font-size:11px;padding:7px 9px}.weapon{min-height:57px;font-size:10px}.weapon .ico{font-size:22px}.target-area{inset:56px 0 0}}
</style>
</head>
<body>
<div class="app">
  <div class="head"><div class="ttl">厄运退散</div><div class="combo">COMBO <span id="combo">0</span></div></div>
  <div class="arena" id="arena">
    <div class="flash" id="flash"></div>
    <div class="hud hidden" id="hud"><div class="stage-name" id="stageName">第一关 · 学院</div><div class="bar"><div class="hp" id="hp"></div></div><div class="rage"><div class="ragefill" id="rage"></div></div><div class="rageText" id="rageText">怒气 0%</div></div>
    <div class="toast" id="toast"></div>
    <div class="target-area" id="targetArea"><div class="target" id="target"><div class="enemy"><div class="enemyIcon" id="enemyIcon">🏫</div><div class="enemyName" id="enemyName">学院</div><div class="enemySub" id="enemySub">今天先拿你开刀</div></div></div></div>
    <div class="overlay" id="start"><div class="card"><h1>厄运退散</h1><div class="tagline">退退退！！！</div><button class="btn" id="startBtn">开打</button></div></div>
    <div class="overlay hidden" id="stageClear"><div class="card"><h2>学院：已暴打</h2><button class="btn" id="nextBtn">下一关</button></div></div>
    <div class="overlay hidden" id="win"><div class="card"><h2>终审判决</h2><div class="verdict">被告一：学院　判处死刑<br>被告二：法考　判处死刑<br>立即执行，一个不留。</div><div class="stamp">死 刑</div><br><button class="btn" id="againBtn">再来一次</button></div></div>
  </div>
  <div class="weapons">
    <button class="weapon active" data-w="slap"><span class="ico">🖐️</span>降龙十八掌</button>
    <button class="weapon" data-w="book"><span class="ico">📚</span>书山压顶</button>
    <button class="weapon" data-w="hammer"><span class="ico">🔨</span>开天神锤</button>
    <button class="weapon" data-w="thunder"><span class="ico">⚡</span>天打雷劈</button>
    <button class="ultimate" id="ultimate">怒气未满 · 天诛地灭</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id),arena=$('arena'),target=$('target'),targetArea=$('targetArea');
const weapons={
 slap:{name:'降龙十八掌',emoji:'💥',min:4,max:7,shake:1,cls:'hit1'},
 book:{name:'书山压顶',emoji:'📚',min:7,max:11,shake:2,cls:'hit2'},
 hammer:{name:'开天神锤',emoji:'🔨',min:9,max:14,shake:2,cls:'hit2'},
 thunder:{name:'天打雷劈',emoji:'⚡',min:11,max:16,shake:3,cls:'hit3'}
};
let stage=1,maxHP=220,hp=220,rage=0,combo=0,current='slap',drag=false,lastHit=0,ctxAudio=null;
function initAudio(){if(!ctxAudio)ctxAudio=new(window.AudioContext||window.webkitAudioContext)();if(ctxAudio.state==='suspended')ctxAudio.resume()}
function osc(type,f1,f2,dur,gain=.18,delay=0){if(!ctxAudio)return;const t=ctxAudio.currentTime+delay,o=ctxAudio.createOscillator(),g=ctxAudio.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(25,f2),t+dur);g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(ctxAudio.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur=.08,gain=.14,filter=1200,delay=0){if(!ctxAudio)return;const sr=ctxAudio.sampleRate,b=ctxAudio.createBuffer(1,Math.ceil(sr*dur),sr),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=ctxAudio.createBufferSource(),f=ctxAudio.createBiquadFilter(),g=ctxAudio.createGain(),t=ctxAudio.currentTime+delay;s.buffer=b;f.type='bandpass';f.frequency.value=filter;f.Q.value=.8;g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(ctxAudio.destination);s.start(t)}
function sound(w,crit=false){initAudio();if(w==='slap'){noise(.055,.24,1600);osc('triangle',180,95,.07,.10)}else if(w==='book'){osc('sine',140,48,.16,.28);noise(.09,.14,480)}else if(w==='hammer'){osc('square',230,105,.11,.16);osc('sine',520,210,.18,.10,.015);noise(.045,.09,2400)}else if(w==='thunder'){noise(.23,.18,1900);osc('sawtooth',340,58,.25,.16);osc('square',110,45,.22,.10,.03)}else if(w==='ult'){osc('sawtooth',130,48,.48,.25);noise(.42,.20,1300);[0,.07,.14,.21].forEach((d,i)=>osc('square',280+i*80,90,.15,.07,d))}if(crit){osc('square',880,440,.08,.08,.01);osc('triangle',1320,660,.09,.05,.015)}}
function haptic(p=1){try{navigator.vibrate?.(p===3?[18,20,28]:p===2?18:9)}catch(e){}}
function toast(s){$('toast').textContent=s;$('toast').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('on'),620)}
function anim(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function splash(x,y,emoji,count=4){const r=arena.getBoundingClientRect();for(let i=0;i<count;i++){const p=document.createElement('div');p.className='particle';p.textContent=emoji;p.style.left=(x-r.left)+'px';p.style.top=(y-r.top)+'px';p.style.setProperty('--x',((Math.random()-.5)*170)+'px');p.style.setProperty('--y',(-55-Math.random()*115)+'px');p.style.setProperty('--r',((Math.random()-.5)*180)+'deg');arena.appendChild(p);setTimeout(()=>p.remove(),650)}}
function damageText(x,y,text,crit=false,word=false){const r=arena.getBoundingClientRect(),d=document.createElement('div');d.className='damage'+(crit?' crit':'')+(word?' word':'');d.textContent=text;d.style.left=(x-r.left)+'px';d.style.top=(y-r.top)+'px';arena.appendChild(d);setTimeout(()=>d.remove(),700)}
function feedback(w,crit,x,y){const o=weapons[w],cls=crit?'hit3':o.cls;anim(target,cls);anim(arena,'shake'+(crit?3:o.shake));if(crit)anim($('flash'),'on');splash(x,y,o.emoji,crit?7:4);sound(w,crit);haptic(crit?3:o.shake)}
function updateHud(){$('hp').style.width=Math.max(0,hp/maxHP*100)+'%';$('rage').style.width=rage+'%';$('rageText').textContent='怒气 '+rage+'%';$('combo').textContent=combo;$('ultimate').classList.toggle('ready',rage>=100);$('ultimate').textContent=rage>=100?'天诛地灭':'怒气未满 · 天诛地灭'}
function hitAt(clientX,clientY,force=false){if($('hud').classList.contains('hidden')||hp<=0)return;initAudio();const now=performance.now();if(!force&&now-lastHit<65)return;lastHit=now;const o=weapons[current],crit=Math.random()<.14;let dmg=Math.floor(o.min+Math.random()*(o.max-o.min+1));if(crit)dmg=Math.round(dmg*2.3);hp=Math.max(0,hp-dmg);rage=Math.min(100,rage+(crit?10:6));combo++;feedback(current,crit,clientX,clientY);damageText(clientX,clientY,crit?'暴击 -'+dmg:'-'+dmg,crit);if(Math.random()<.2)damageText(clientX+20,clientY+10,o.name,false,true);updateHud();if(hp<=0)setTimeout(stageDone,380)}
function stageDone(){$('hud').classList.add('hidden');if(stage===1)$('stageClear').classList.remove('hidden');else $('win').classList.remove('hidden')}
function loadStage(n){stage=n;maxHP=n===1?220:330;hp=maxHP;rage=0;combo=0;current='slap';document.querySelectorAll('.weapon').forEach(b=>b.classList.toggle('active',b.dataset.w==='slap'));$('stageName').textContent=n===1?'第一关 · 学院':'第二关 · 法考';$('enemyIcon').textContent=n===1?'🏫':'⚖️';$('enemyName').textContent=n===1?'学院':'法考';$('enemySub').textContent=n===1?'今天先拿你开刀':'最后一位';$('hud').classList.remove('hidden');updateHud()}
function ultimate(){if(rage<100||hp<=0)return;rage=0;sound('ult');haptic(3);anim(arena,'shake3');anim($('flash'),'on');const r=target.getBoundingClientRect();let n=0;const timer=setInterval(()=>{n++;const x=r.left+r.width*(.28+Math.random()*.44),y=r.top+r.height*(.25+Math.random()*.5);const pool=['slap','book','hammer','thunder'],w=pool[n%pool.length];current=w;hitAt(x,y,true);if(n>=12){clearInterval(timer);current='slap'}},72)}
$('startBtn').addEventListener('click',()=>{initAudio();$('start').classList.add('hidden');loadStage(1)});$('nextBtn').addEventListener('click',()=>{$('stageClear').classList.add('hidden');loadStage(2)});$('againBtn').addEventListener('click',()=>{$('win').classList.add('hidden');loadStage(1)});
document.querySelectorAll('.weapon').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();current=btn.dataset.w;document.querySelectorAll('.weapon').forEach(b=>b.classList.remove('active'));btn.classList.add('active');initAudio()}));$('ultimate').addEventListener('click',e=>{e.stopPropagation();ultimate()});
targetArea.addEventListener('pointerdown',e=>{drag=true;targetArea.setPointerCapture?.(e.pointerId);hitAt(e.clientX,e.clientY);e.preventDefault()},{passive:false});targetArea.addEventListener('pointermove',e=>{if(drag)hitAt(e.clientX,e.clientY);e.preventDefault()},{passive:false});targetArea.addEventListener('pointerup',e=>{drag=false;e.preventDefault()},{passive:false});targetArea.addEventListener('pointercancel',()=>drag=false);
let lastTouch=0;document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouch<=300)e.preventDefault();lastTouch=now},{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
updateHud();
</script>
</body>
</html>
