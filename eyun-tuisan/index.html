<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>厄运退散</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#2f3347;background:linear-gradient(145deg,#fff3d8,#dff6ff)}body{display:flex;align-items:center;justify-content:center}.app{width:min(980px,100vw);height:min(760px,100vh);padding:10px;display:flex;flex-direction:column;gap:9px}.head{display:flex;justify-content:space-between;align-items:center;padding:1px 3px}.title{font-size:24px;font-weight:900}.sub{font-size:12px;opacity:.62;margin-top:2px}.combo{font-weight:900;background:#ffffffc9;border-radius:999px;padding:8px 12px;box-shadow:0 7px 20px #40516c18}.arena{position:relative;flex:1;min-height:0;border-radius:24px;overflow:hidden;background:linear-gradient(#ddf5ff 0 72%,#c7edb8 72%);box-shadow:0 18px 50px #40516c22;touch-action:none}.cloud{position:absolute;width:96px;height:31px;border-radius:40px;background:#ffffffa3}.c1{top:12%;left:7%;animation:float 10s ease-in-out infinite}.c2{top:24%;right:8%;animation:float 14s ease-in-out infinite reverse}@keyframes float{50%{transform:translateX(32px)}}.hud{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(640px,88%);z-index:3}.stage-title{text-align:center;font-size:13px;font-weight:900;margin-bottom:5px}.bar{height:15px;border-radius:999px;background:#fff;overflow:hidden;box-shadow:0 5px 14px #40516c17}.hp{height:100%;width:100%;background:linear-gradient(90deg,#ffac75,#ff6688);transition:width .1s}.rage{margin-top:7px;height:7px;border-radius:999px;background:#ffffffb5;overflow:hidden}.ragefill{height:100%;width:0;background:linear-gradient(90deg,#7d8cff,#b56dff);transition:width .12s}.rage-label{text-align:right;font-size:10px;margin-top:2px;opacity:.62}.target-wrap{position:absolute;inset:70px 0 10px;display:flex;align-items:center;justify-content:center;z-index:2}.target{position:relative;width:min(330px,66vw);height:min(330px,45vh);display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none;cursor:grab;transform-origin:center}.target.hit{animation:hit .12s linear}.target.big-hit{animation:bigHit .22s ease-out}@keyframes hit{25%{transform:translate(-9px,3px) rotate(-3deg)}60%{transform:translate(8px,-2px) rotate(3deg)}100%{transform:none}}@keyframes bigHit{25%{transform:scale(.89) rotate(-6deg)}55%{transform:scale(1.08) rotate(5deg)}100%{transform:none}}.enemy{width:82%;height:82%;border-radius:28px;background:#fff8;box-shadow:0 18px 45px #43506b25;display:flex;flex-direction:column;justify-content:center;align-items:center;border:3px solid #ffffffbf}.enemy-icon{font-size:clamp(78px,17vw,132px);line-height:1}.enemy-name{font-size:clamp(26px,6vw,42px);font-weight:1000;margin-top:4px}.enemy-sub{font-size:12px;opacity:.55;margin-top:5px}.float-text{position:absolute;font-weight:1000;font-size:20px;pointer-events:none;animation:pop .72s ease-out forwards;text-shadow:0 2px #fff}.float-emoji{position:absolute;font-size:34px;pointer-events:none;animation:fly .75s ease-out forwards}@keyframes pop{0%{opacity:0;transform:translate(-50%,0) scale(.7)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-70px) scale(1.28)}}@keyframes fly{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(.5)}}.toast{position:absolute;left:50%;top:74px;transform:translateX(-50%);padding:8px 13px;border-radius:999px;background:#2f3347e9;color:#fff;font-size:13px;opacity:0;z-index:6;transition:.18s;white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,4px)}.weapons{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.weapon{border:0;background:#ffffffda;border-radius:16px;padding:9px 5px;min-height:58px;box-shadow:0 8px 18px #40516c18;color:#2f3347;font-weight:850;font-size:12px;touch-action:manipulation}.weapon .ico{display:block;font-size:24px;margin-bottom:2px}.weapon.active{outline:3px solid #ff8fa5;background:#fff}.ultimate{grid-column:1/-1;border:0;border-radius:16px;min-height:47px;background:linear-gradient(90deg,#6f7eff,#a65ef6);color:#fff;font-size:15px;font-weight:1000;box-shadow:0 9px 20px #625be02e;opacity:.43}.ultimate.ready{opacity:1;animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.012)}}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#ffffff4f;backdrop-filter:blur(6px);z-index:10}.card{width:min(560px,94%);border-radius:25px;background:#fffffff3;padding:28px 22px;text-align:center;box-shadow:0 20px 55px #35455e2d}.card h1,.card h2{margin:0}.card h1{font-size:clamp(39px,9vw,60px)}.card h2{font-size:clamp(30px,7vw,44px)}.card p{line-height:1.75;margin:14px 0 0}.btn{border:0;border-radius:16px;padding:13px 28px;background:#2f3347;color:#fff;font-weight:900;font-size:16px;margin-top:18px}.verdict{border:2px solid #e34955;border-radius:16px;margin-top:16px;padding:15px;color:#8d2730;background:#fff9f8;font-weight:900;line-height:1.8}.stamp{display:inline-block;border:4px solid #d83f4b;color:#d83f4b;border-radius:10px;font-size:28px;padding:4px 10px;transform:rotate(-8deg);margin-top:14px;font-weight:1000}.hidden{display:none!important}@media(max-width:650px){.app{padding:8px}.title{font-size:21px}.combo{font-size:12px}.weapons{grid-template-columns:repeat(5,1fr);gap:5px}.weapon{font-size:10px;padding:7px 2px;min-height:54px}.weapon .ico{font-size:22px}.target-wrap{inset:62px 0 4px}}
</style>
</head>
<body>
<div class="app">
  <div class="head"><div><div class="title">厄运退散</div><div class="sub">不躲了。今天只负责暴打。</div></div><div class="combo">COMBO × <span id="combo">0</span></div></div>
  <div class="arena" id="arena">
    <div class="cloud c1"></div><div class="cloud c2"></div>
    <div class="hud hidden" id="hud"><div class="stage-title" id="stageTitle">第一关 · 暴打学院</div><div class="bar"><div class="hp" id="hp"></div></div><div class="rage"><div class="ragefill" id="rage"></div></div><div class="rage-label">怒气值 <span id="rageText">0</span>%</div></div>
    <div class="target-wrap"><div class="target" id="target"><div class="enemy"><div class="enemy-icon" id="enemyIcon">🏫</div><div class="enemy-name" id="enemyName">学院</div><div class="enemy-sub" id="enemySub">拖着打、点着打，怎么爽怎么来</div></div></div></div>
    <div class="toast" id="toast"></div>

    <div class="overlay" id="start"><div class="card"><h1>厄运退散</h1><p>两关，没有闪避，没有失败。<br><b>第一关：暴打学院。</b><br><b>第二关：暴打法考。</b><br><br>选个顺手的家伙，点、拖、狂按都行。<br>怒气满了还有必杀。</p><button class="btn" onclick="startGame()">开始行刑</button></div></div>

    <div class="overlay hidden" id="between"><div class="card"><h2>学院，拿下。</h2><p>暂时押送一边。<br>下一个被告已经在门口排队了。</p><button class="btn" onclick="nextStage()">传法考</button></div></div>

    <div class="overlay hidden" id="win"><div class="card"><h2>终审判决</h2><div class="verdict">被告一：学院 —— 判处死刑<br>被告二：法考 —— 判处死刑<br>立即执行，一个不留。</div><div class="stamp">死刑</div><p>今日厄运清零。<br>剩下的事情，明天再说。</p><button class="btn" onclick="startGame()">再审一遍</button></div></div>
  </div>

  <div class="weapons">
    <button class="weapon active" data-w="slap"><span class="ico">🖐️</span>连环巴掌</button>
    <button class="weapon" data-w="book"><span class="ico">📚</span>法典暴扣</button>
    <button class="weapon" data-w="hammer"><span class="ico">🔨</span>正义锤</button>
    <button class="weapon" data-w="stamp"><span class="ico">🟥</span>退散盖章</button>
    <button class="weapon" data-w="light"><span class="ico">⚡</span>知识雷劈</button>
    <button class="ultimate" id="ultimate">怒气未满 · 必杀「全部给我退散」</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id),arena=$('arena'),target=$('target');
let stage=0,maxHp=180,hp=180,rage=0,combo=0,weapon='slap',playing=false,drag=false,lastHit=0,lastX=0,lastY=0,comboTimer=null;
const stages=[{name:'学院',icon:'🏫',title:'第一关 · 暴打学院',sub:'关系、通知、机会、排名，今天先统一挨揍',hp:180},{name:'法考',icon:'⚖️',title:'第二关 · 暴打法考',sub:'你负责挨打，我负责过关',hp:260}];
const W={
 slap:{d:5,e:'🖐️',words:['啪！','再来！','退！','少烦我！']},
 book:{d:10,e:'📚',words:['法典暴扣！','知识压制！','啪叽！']},
 hammer:{d:13,e:'🔨',words:['咚！','正义执行！','当场敲扁！']},
 stamp:{d:9,e:'🟥',words:['退散！','驳回！','无效！','盖章！']},
 light:{d:12,e:'⚡',words:['劈！','知识雷！','清醒一下！']}
};
function show(id,v=true){$(id).classList.toggle('hidden',!v)}
function say(s){$('toast').textContent=s;$('toast').classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>$('toast').classList.remove('on'),650)}
function startGame(){stage=0;show('start',false);show('between',false);show('win',false);show('hud',true);loadStage();playing=true}
function loadStage(){let s=stages[stage];maxHp=s.hp;hp=maxHp;rage=0;combo=0;$('enemyName').textContent=s.name;$('enemyIcon').textContent=s.icon;$('enemySub').textContent=s.sub;$('stageTitle').textContent=s.title;$('combo').textContent='0';updateBars();say(stage===0?'先打学院。':'现在轮到法考。')}
function nextStage(){stage=1;show('between',false);loadStage();playing=true}
function updateBars(){$('hp').style.width=Math.max(0,hp/maxHp*100)+'%';$('rage').style.width=Math.min(100,rage)+'%';$('rageText').textContent=Math.floor(rage);let u=$('ultimate');if(rage>=100){u.classList.add('ready');u.textContent='必杀就绪 · 全部给我退散'}else{u.classList.remove('ready');u.textContent='怒气 '+Math.floor(rage)+'% · 必杀「全部给我退散」'}}
function floating(text,x,y,emoji,big=false){let f=document.createElement('div');f.className='float-text';f.textContent=text;f.style.left=x+'px';f.style.top=y+'px';f.style.fontSize=(big?28:20)+'px';arena.appendChild(f);setTimeout(()=>f.remove(),750);for(let i=0;i<(big?8:3);i++){let e=document.createElement('div');e.className='float-emoji';e.textContent=emoji;e.style.left=x+'px';e.style.top=y+'px';e.style.setProperty('--dx',((Math.random()-.5)*(big?240:120))+'px');e.style.setProperty('--dy',(-50-Math.random()*(big?180:90))+'px');e.style.setProperty('--rot',((Math.random()-.5)*220)+'deg');arena.appendChild(e);setTimeout(()=>e.remove(),800)}}
function hit(x,y,mult=1){if(!playing||hp<=0)return;let w=W[weapon],damage=Math.max(1,Math.round(w.d*mult));hp-=damage;rage=Math.min(100,rage+damage*.72);combo++;$('combo').textContent=combo;clearTimeout(comboTimer);comboTimer=setTimeout(()=>{combo=0;$('combo').textContent='0'},1300);target.classList.remove('hit');void target.offsetWidth;target.classList.add(mult>2?'big-hit':'hit');floating(w.words[Math.floor(Math.random()*w.words.length)],x,y,w.e,mult>2);updateBars();if(hp<=0)setTimeout(stageClear,240)}
function stageClear(){playing=false;hp=0;updateBars();if(stage===0)show('between',true);else show('win',true)}
function ultimate(){if(!playing||rage<100)return;rage=0;updateBars();say('必杀：全部给我退散！！！');let n=0;let timer=setInterval(()=>{let r=target.getBoundingClientRect(),a=arena.getBoundingClientRect();let x=r.left-a.left+r.width*(.2+Math.random()*.6),y=r.top-a.top+r.height*(.2+Math.random()*.6);let old=weapon;weapon=['slap','book','hammer','stamp','light'][n%5];hit(x,y,2.2);weapon=old;n++;if(n>=12||hp<=0)clearInterval(timer)},70)}
function pos(e){let a=arena.getBoundingClientRect();return{x:e.clientX-a.left,y:e.clientY-a.top}}
target.addEventListener('pointerdown',e=>{if(!playing)return;drag=true;target.setPointerCapture?.(e.pointerId);let p=pos(e);lastX=e.clientX;lastY=e.clientY;lastHit=performance.now();hit(p.x,p.y,1);e.preventDefault()},{passive:false});
target.addEventListener('pointermove',e=>{if(!playing||!drag)return;let now=performance.now(),dx=e.clientX-lastX,dy=e.clientY-lastY,dist=Math.hypot(dx,dy);if(dist>14||now-lastHit>90){let p=pos(e);hit(p.x,p.y,dist>45?1.6:1);lastHit=now;lastX=e.clientX;lastY=e.clientY}e.preventDefault()},{passive:false});
target.addEventListener('pointerup',e=>{drag=false;e.preventDefault()},{passive:false});target.addEventListener('pointercancel',()=>drag=false);
document.querySelectorAll('.weapon').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.weapon').forEach(x=>x.classList.remove('active'));b.classList.add('active');weapon=b.dataset.w;say('切换：'+b.textContent.trim())}));
$('ultimate').addEventListener('click',ultimate);
</script>
</body>
</html>
